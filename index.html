    <script>
      // Remove "Made in Bolt" badge injected by Bolt.new hosting
      function removeBoltBadge() {
        const selectors = [
          'a[href*="bolt.new"]',
          'a[href*="stackblitz"]',
          'iframe[src*="bolt.new"]',
          '[id*="bolt"]',
          '[class*="bolt-badge"]',
          '[data-bolt-badge]'
        ];
        selectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => el.remove());
        });
      }
      // Run immediately and observe for late injection
      document.addEventListener('DOMContentLoaded', removeBoltBadge);
      const observer = new MutationObserver(removeBoltBadge);
      observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
